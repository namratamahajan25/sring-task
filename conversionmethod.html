<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Case Conversion Methods</h1>

    <script>

        // 1.Convert 'PYTHON' to Lowercase
        let s1 = 'PYTHON';
        console.log(s1.toLowerCase());

        // 2.convert 'machine learning' to Uppercase

        let s2 = 'machine learning';
        console.log(s2.toUpperCase());

        // 3.Convert 'hello world' to title case

        let s3 = "hello world";
        let titleCase = s3.split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");

        console.log(titleCase);

        // 4.Applay swapcase() on 'PyThOn'

        let s4 = "PyThOn";
        let swapCase = "";

        for (let i = 0; i < s4.length; i++) {
            if (s4[i] === s4[i].toUpperCase()) {
                swapCase += s4[i].toLowerCase();
            } else {
                swapCase += s4[i].toUpperCase();
            }
        }
        console.log(swapCase);

        // 5.Convert 'pYtHoN PrOgRaMmInG' to proper title case

        let s5 = "pYtHoN PrOgRaMmInG";

        let result = s5.toLowerCase()
            .split(" ")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");

        console.log(result);


    </script>
</body>

</html>
